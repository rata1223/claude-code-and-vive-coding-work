engines:
  bandit:
    enabled: false
  # Disabled: noisy/low-value here and (eslint/pmd) emit "No rules found" warnings.
  eslint:
    enabled: false
  pmd:
    enabled: false
  pmd-legacy:
    enabled: false

# Exclude binaries + vendored/build dirs from analysis (hygiene; fewer files for
# the formatter to read). NOTE: the SARIF MalformedInputException crash is a JVM
# default-charset issue on non-ASCII (Korean) SOURCE files — the decisive fix is
# the UTF-8 env in .github/workflows/codacy.yml, not these excludes.
exclude_paths:
  - "node_modules/**"
  - "**/node_modules/**"
  - "dist/**"
  - "**/dist/**"
  - "**/*.png"
  - "**/*.jpg"
  - "**/*.jpeg"
  - "**/*.gif"
  - "**/*.ico"
  - "**/*.webp"
  - "**/*.jks"
  - "**/*.keystore"
  - "**/*.woff"
  - "**/*.woff2"
  - "**/*.ttf"
  - "**/*.eot"
  - "**/*.pdf"
  - "**/*.zip"
  - "**/*.jar"
