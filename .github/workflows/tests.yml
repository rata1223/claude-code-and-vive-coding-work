name: Tests (PostgreSQL)

# Runs the backend test suite against PostgreSQL — the canonical CI database
# (production also runs Postgres). Tests pick up TEST_DATABASE_URL via
# backend/database/testing.make_test_engine; without it they fall back to SQLite.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the suite only needs to read the repo to check out and test.
permissions:
  contents: read

jobs:
  pytest-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quantdinger
          POSTGRES_PASSWORD: quantdinger
          POSTGRES_DB: quantdinger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quantdinger"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://quantdinger:quantdinger@localhost:5432/quantdinger_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite against PostgreSQL
        run: pytest backend tests -q
