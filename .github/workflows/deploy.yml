name: Deploy to Oracle Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: "수동 배포 사유"
        required: false
        default: "수동 실행"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            APP_DIR="$HOME/kis-trading"

            # 저장소가 없으면 클론
            if [ ! -d "$APP_DIR/.git" ]; then
              git clone https://github.com/rata1223/claude-code-and-vive-coding-work.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git pull origin main

            # .env 파일이 없으면 example로 생성
            if [ ! -f .env ]; then
              cp .env.example .env
              echo "⚠️  .env 파일이 생성됐습니다. 서버에서 값을 직접 입력해주세요."
            fi

            # 이미지 빌드 및 서비스 재시작
            docker compose pull quantdinger || true
            docker compose up -d --build

            # 헬스체크
            sleep 10
            docker compose ps
