version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    container_name: quantdinger-db
    environment:
      POSTGRES_DB: quantdinger
      POSTGRES_USER: quantdinger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set to a strong random value (see .env.example)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdinger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: quantdinger-redis
    command: >
      sh -c 'if [ -n "$$REDIS_PASSWORD" ];
             then redis-server --requirepass "$$REDIS_PASSWORD";
             else redis-server; fi'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c 'if [ -n "$$REDIS_PASSWORD" ];
               then redis-cli -a "$$REDIS_PASSWORD" ping;
               else redis-cli ping; fi'
      interval: 10s
      timeout: 5s
      retries: 5

  # Vue 3 모바일 프론트엔드
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://api:8000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    container_name: quantdinger-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://quantdinger:${POSTGRES_PASSWORD}@postgres:5432/quantdinger
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set to a secure random value (see .env.example)}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      KIS_CREDENTIAL_KEY: ${KIS_CREDENTIAL_KEY:?KIS_CREDENTIAL_KEY must be set. Generate: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  # DISABLED: kis-bot is the legacy trading engine (bot/main.py).
  # Running it simultaneously with kis-worker would place duplicate orders on the same KIS account.
  # Uncomment ONLY if kis-worker is fully stopped and you need the legacy engine for diagnostics.
  #
  # kis-bot:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.kis-bot
  #   restart: unless-stopped
  #   container_name: kis-bot
  #   environment:
  #     KIS_APP_KEY: ${KIS_APP_KEY}
  #     KIS_APP_SECRET: ${KIS_APP_SECRET}
  #     KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
  #     KIS_ENV: ${KIS_ENV:-paper}
  #     KIS_HTS_ID: ${KIS_HTS_ID:-}
  #     TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
  #     TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  #     REDIS_URL: redis://redis:6379
  #     DB_URL: postgresql://quantdinger:${POSTGRES_PASSWORD:-quantdinger}@postgres:5432/quantdinger
  #     DAILY_LOSS_LIMIT_PCT: ${DAILY_LOSS_LIMIT_PCT:-0.03}
  #     MDD_LIMIT_PCT: ${MDD_LIMIT_PCT:-0.15}
  #     STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.07}
  #   volumes:
  #     - kis_data:/app/data
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

  kis-api:
    build:
      context: .
      dockerfile: Dockerfile.kis-bot
    restart: unless-stopped
    container_name: kis-api
    command: python -m backend.api.server
    ports:
      - "5001:5001"
    environment:
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
      KIS_ENV: ${KIS_ENV:-paper}
      REDIS_URL: redis://redis:6379
      DB_URL: postgresql://quantdinger:${POSTGRES_PASSWORD}@postgres:5432/quantdinger
      API_PORT: "5001"
      KIS_API_KEY: ${KIS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5

  kis-worker:
    build:
      context: .
      dockerfile: Dockerfile.kis-bot
    restart: unless-stopped
    container_name: kis-worker
    command: python -m backend.worker.runner
    environment:
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
      KIS_ENV: ${KIS_ENV:-paper}
      # Set ENABLE_LIVE_TRADING=true ONLY after completing 4-week paper run.
      # Default false = shadow execution: full signals generated but no orders submitted.
      ENABLE_LIVE_TRADING: ${ENABLE_LIVE_TRADING:-false}
      REDIS_URL: redis://redis:6379
      DB_URL: postgresql://quantdinger:${POSTGRES_PASSWORD}@postgres:5432/quantdinger
      DAILY_LOSS_LIMIT_PCT: ${DAILY_LOSS_LIMIT_PCT:-0.03}
      MDD_LIMIT_PCT: ${MDD_LIMIT_PCT:-0.15}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.07}
    volumes:
      - kis_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kis-ws:
    build:
      context: .
      dockerfile: Dockerfile.kis-bot
    restart: unless-stopped
    container_name: kis-ws
    command: python -m backend.websocket.server
    ports:
      - "5002:5002"
    environment:
      REDIS_URL: redis://redis:6379
      QUANTDINGER_SECRET_KEY: ${QUANTDINGER_SECRET_KEY:?QUANTDINGER_SECRET_KEY must be set (see .env.example)}
      WS_PORT: "5002"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  kis_data:
