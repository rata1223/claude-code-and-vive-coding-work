version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: quantdinger
      POSTGRES_USER: quantdinger
      POSTGRES_PASSWORD: quantdinger
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantdinger"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  quantdinger:
    image: brokermr810/quantdinger:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql://quantdinger:quantdinger@postgres:5432/quantdinger
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${QUANTDINGER_SECRET_KEY:-changeme-set-in-env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  kis-bot:
    build:
      context: .
      dockerfile: Dockerfile.kis-bot
    restart: unless-stopped
    environment:
      KIS_APP_KEY: ${KIS_APP_KEY}
      KIS_APP_SECRET: ${KIS_APP_SECRET}
      KIS_ACCOUNT_NO: ${KIS_ACCOUNT_NO}
      KIS_ENV: ${KIS_ENV:-paper}
      KIS_HTS_ID: ${KIS_HTS_ID:-}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      REDIS_URL: redis://redis:6379
      DB_URL: ${DB_URL:-postgresql://quantdinger:quantdinger@postgres:5432/quantdinger}
      DAILY_LOSS_LIMIT_PCT: ${DAILY_LOSS_LIMIT_PCT:-0.03}
      MDD_LIMIT_PCT: ${MDD_LIMIT_PCT:-0.15}
      STOP_LOSS_PCT: ${STOP_LOSS_PCT:-0.07}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
